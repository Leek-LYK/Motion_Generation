[project]
name = "kimodo-g1-repro"
version = "0.1.0"
description = "Data preparation and training environment for the Kimodo G1 reproduction"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.15.0",
    "einops==0.8.2",
    "kimodo",
    "modelscope-hub==0.4.6",
    "mujoco==3.8.1",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "peft==0.21.2",
    "pyarrow==19.0.1",
    "safetensors==0.8.0",
    "scipy==1.15.3",
    "setuptools==80.9.0",
    "tensorboard==2.20.0",
    "torch==2.7.1+cu128",
    "transformers==5.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
kimodo = { path = "../kimodo/source", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
